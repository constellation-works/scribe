[package]
name = "scribe-core"
description = "The scribe store as a library: entries, session records, proposals, the verbatim check and persistence. No terminal, no argument parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "scribe_core"
path = "src/lib.rs"

# Use cases over the store. scripts/check-dependency-direction.sh rejects
# clap, tracing-subscriber, any other surface crate and rusqlite here; the
# store tests stage database states with rusqlite as a dev-dependency.
[features]
# `Store::seed_records`, for the CLI's integration tests to stage records in
# `scribe.db`, and `testing` (`scribe_store::testing`). Only dev-dependencies
# turn it on: `scribe`'s, and scribe-core's own for its tests.
test-support = ["scribe-store/test-support"]

[dependencies]
# The captured process environment (`composition::Env::terminal`), which the
# binary's terminal decision reads. The core names `cw_app::Env` only to hold it.
cw-app = { workspace = true }
cw-fs = { workspace = true }
scribe-store = { workspace = true }
scribe-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The codex adapter hands the child its schema and instructions in a private
# temporary directory (providers/cli/codex.rs).
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

# Unix only: the model adapters lead their own process group and observe the
# leader's exit with `waitid(WNOWAIT)` (STD-03 R11-R14).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
scribe-core = { path = ".", features = ["test-support"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
