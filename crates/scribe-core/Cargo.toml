[package]
name = "scribe-core"
description = "The scribe store as a library: entries, session records, proposals, the verbatim check and persistence. No terminal, no argument parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "scribe_core"
path = "src/lib.rs"

# Domain dependencies only. scripts/check-dependency-direction.sh rejects
# clap, tracing-subscriber and any other surface crate here.
[features]
# `Store::seed_records`, for the CLI's integration tests to stage records in
# `scribe.db`, and `testing::StoreTestReads`. Only dev-dependencies turn it
# on: `scribe`'s, and scribe-core's own for its integration tests.
test-support = []

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
yaml_serde = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
scribe-core = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
