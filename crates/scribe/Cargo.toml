[package]
name = "scribe"
description = "Keep the user's marked preferences and opted-in session records, and answer from them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scribe"
path = "src/main.rs"

[dependencies]
scribe-core = { workspace = true }
# The output sink and its terminal decision (STD-01 R6-R9, R13, R14, R17).
# cw-app is named for the captured `Env` that decision reads, nothing else.
cw-app = { workspace = true }
cw-cli = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# Tests stage entries and session records in `scribe.db` with
# `Store::seed_records`.
scribe-core = { workspace = true, features = ["test-support"] }
# Tests edit `scribe.db` by hand to stage states no command writes.
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
yaml_serde = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
