[package]
name = "scribe"
description = "Keep the user's marked preferences and opted-in session records, and answer from them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scribe"
path = "src/main.rs"

[dependencies]
scribe-core = { workspace = true }
tempfile = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }

# Unix only: the host name stamped on records and the effective uid the
# transcript owner is checked against (STD-05 R1, R9), and the terminal's
# width, asked of stdout when `COLUMNS` is unset (STD-01 R17).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "system", "termios"] }

[dev-dependencies]
# Tests stage entries and session records in `scribe.db` with
# `Store::seed_records`.
scribe-core = { workspace = true, features = ["test-support"] }
# Tests edit `scribe.db` by hand to stage states no command writes.
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
yaml_serde = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
