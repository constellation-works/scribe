[package]
name = "scribe"
description = "Keep Daniel's marked decisions and preferences and his opted-in session records, and answer from them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scribe"
path = "src/main.rs"

[dependencies]
scribe-core = { workspace = true }
tempfile = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Unix only: the host name stamped on records and the effective uid the
# transcript owner is checked against (STD-05 R1, R9).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "system"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
yaml_serde = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
