[package]
name = "scribe-domain"
description = "scribe's records and the pure rules over them: entries, session records, proposals, tags, transcripts and the model request shapes. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "scribe_domain"
path = "src/lib.rs"

# Pure dependencies only. scripts/check-dependency-direction.sh rejects
# rusqlite, tempfile, rustix and every surface crate here.
[features]
# `fixtures`: the record fixtures scribe-core's store tests share. Only
# dev-dependencies turn it on.
test-support = ["time/macros"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
