[workspace]
resolver = "3"
# The crates and why: docs/design/scribe/4_decisions.md. A new member needs a
# policy entry in scripts/check-dependency-direction.sh and a row in
# ARCHITECTURE.md.
members = [
    "crates/scribe-store",
    "crates/scribe-tools",
    "crates/scribe-core",
    "crates/scribe",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
# 1.89 stabilized `File::lock`/`File::try_lock`, which the store's advisory
# lock uses instead of a third-party crate.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/constellation-works/scribe"

[workspace.dependencies]
scribe-store = { path = "crates/scribe-store" }
scribe-tools = { path = "crates/scribe-tools" }
scribe-core = { path = "crates/scribe-core" }
# No `color` or `wrap_help`: both make clap query the terminal itself, and the
# output sink is the only place allowed to do that (STD-01 R17). Help is plain
# text everywhere, which also keeps the help goldens byte-stable.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# scribe.db (docs/design/scribe/2_design.md §15.7). `bundled` compiles
# SQLite from source with FTS5 on, so every platform gets the same engine and
# the BM25 message search, with no system library. Used by
# scribe-core::store::db only (scripts/check-dependency-direction.sh).
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
# Unix only: the process's effective uid, for the store ownership check
# (STD-05 R9). std has no safe `geteuid`; tempfile already builds rustix.
rustix = { version = "1", default-features = false, features = ["std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The cite's prompt_sha256 (docs/design/scribe/2_design.md §4.1). RustCrypto,
# MIT or Apache-2.0; no default features beyond std.
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
# config.toml is read, never written by scribe: the parser and serde only, no
# writer and no `debug` feature (which would pull terminal crates).
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# NFC for the verbatim check (docs/design/scribe/2_design.md §6.4).
unicode-normalization = "0.1"
# Display columns for table alignment and truncation (STD-01 R14, R15): a
# wide CJK character or emoji takes two, a combining mark none. MIT or
# Apache-2.0, no dependencies.
unicode-width = { version = "0.2", default-features = false }
# Entry and session frontmatter. The YAML organization's maintained
# continuation of serde_yaml; why this one: docs/design/scribe/4_decisions.md
# ("Frontmatter is parsed by yaml_serde").
yaml_serde = "0.10"
tracing = "0.1"
# No `ansi`: log lines go to stderr as plain text in every mode.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[profile.release]
strip = true

# STD-02 lint baseline, verbatim from the standard. Do not trim it; add to it.
# Workspace-wide lint config. Each crate opts in via `[lints] workspace = true`.
# Keep this list short — only rules that are mechanically true everywhere.
[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Adoptable additions beyond the baseline (STD-02 "Adoptable additions").
# STD-02 R27: no wildcard arm on an enum match; a foreign enum that needs one
# gets a scoped #[allow] with its reason.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# STD-02 R28: narrowing `as` casts must be checked conversions.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[workspace.lints.rust]
missing_docs = "warn"
