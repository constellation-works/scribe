[workspace]
resolver = "3"
# The crates and why: docs/design/scribe/4_decisions.md. A new member needs a
# policy entry in scripts/check-dependency-direction.sh and a row in
# ARCHITECTURE.md.
members = [
    "crates/scribe-store",
    "crates/scribe-tools",
    "crates/scribe-core",
    "crates/scribe",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
# 1.89 stabilized `File::try_lock`, which cw-fs's advisory lock uses; the kit
# states the same floor.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/constellation-works/scribe"

[workspace.dependencies]
# The cw-kit (https://github.com/constellation-works/satellites): file access
# for a private data directory (cw-fs), SQLite open/configure/migrate
# (cw-sqlite) and the output sink (cw-cli). cw-app is named for the captured
# `Env` that cw-cli's terminal decision reads and for the `EnvVar` declarations
# of the variables scribe reads (composition's usage table); scribe's audit guard
# is not the kit's. No release is published yet, so the workspace pins one commit
# of the satellites `agent-main` for every kit crate; moving the pin is a
# change of its own.
cw-fs = { git = "https://github.com/constellation-works/satellites", rev = "79c755a6615ca4da7063738a3326fbb3c96dea1f" }
cw-sqlite = { git = "https://github.com/constellation-works/satellites", rev = "79c755a6615ca4da7063738a3326fbb3c96dea1f" }
cw-cli = { git = "https://github.com/constellation-works/satellites", rev = "79c755a6615ca4da7063738a3326fbb3c96dea1f" }
cw-app = { git = "https://github.com/constellation-works/satellites", rev = "79c755a6615ca4da7063738a3326fbb3c96dea1f" }
scribe-store = { path = "crates/scribe-store" }
scribe-tools = { path = "crates/scribe-tools" }
scribe-core = { path = "crates/scribe-core" }
# No `color` or `wrap_help`: both make clap query the terminal itself, and the
# output sink is the only place allowed to do that (STD-01 R17). Help is plain
# text everywhere, which also keeps the help goldens byte-stable.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# Dev-dependency for tests that stage `scribe.db` states directly; `scribe-store`
# uses `cw-sqlite`'s re-exported `rusqlite` (same 0.43 bundled SQLite with FTS5).
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
# Unix only: the process's effective uid, for the project scaffold's owner
# check (STD-05 R9) and the beneath-a-root opens. std has no safe `geteuid`;
# tempfile already builds rustix.
rustix = { version = "1", default-features = false, features = ["std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The cite's prompt_sha256 (docs/design/scribe/2_design.md §4.1). RustCrypto,
# MIT or Apache-2.0; no default features beyond std.
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
# config.toml is read, never written by scribe: the parser and serde only, no
# writer and no `debug` feature (which would pull terminal crates).
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# NFC for the verbatim check (docs/design/scribe/2_design.md §6.4).
unicode-normalization = "0.1"
# Display columns for table alignment and truncation (STD-01 R14, R15): a
# wide CJK character or emoji takes two, a combining mark none. MIT or
# Apache-2.0, no dependencies.
unicode-width = { version = "0.2", default-features = false }
# Entry and session frontmatter. The YAML organization's maintained
# continuation of serde_yaml; why this one: docs/design/scribe/4_decisions.md
# ("Frontmatter is parsed by yaml_serde").
yaml_serde = "0.10"
tracing = "0.1"
# No `ansi`: log lines go to stderr as plain text in every mode.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[profile.release]
strip = true

# STD-02 lint baseline, verbatim from the standard. Do not trim it; add to it.
# Workspace-wide lint config. Each crate opts in via `[lints] workspace = true`.
# Keep this list short — only rules that are mechanically true everywhere.
[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
# STD-02 R3, R5, R6: file, environment, process, channel and SQLite-open
# boundaries live in clippy.toml so Clippy resolves every path spelling.
disallowed_methods = "deny"
disallowed_types = "deny"
# Independent of disallowed_methods expectations on host adapters. That lint
# still covers main, which clippy::exit intentionally exempts.
exit = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Adoptable additions beyond the baseline (STD-02 "Adoptable additions").
# STD-02 R27: no wildcard arm on an enum match; a foreign enum that needs one
# gets a scoped #[allow] with its reason.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# STD-02 R28: narrowing `as` casts must be checked conversions.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[workspace.lints.rust]
missing_docs = "warn"
