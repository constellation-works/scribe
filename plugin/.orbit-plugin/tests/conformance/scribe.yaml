# Goldens for `orbit plugin test plugin/.orbit-plugin`: a temp workspace and
# plugin state, the manifest's config defaults (no store root), no network.
# A store-backed call needs [plugins.scribe] root, so the goldens are the
# tools' refusals; crates/scribe/tests/plugin.rs runs every tool against a
# fixture store.
schemaVersion: 1
kind: PluginTest
tests:
- name: session_pass_without_a_store_root_is_not_configured
  tool: session-pass-prepare
  input: {}
  expect:
    error:
      code: not_configured
      retryable: false
- name: session_pass_with_an_input_key_is_invalid
  tool: session-pass-prepare
  input:
    limit: 1
  expect:
    error:
      code: invalid_input
- name: consistency_scan_without_a_store_root_is_not_configured
  tool: consistency-scan
  input: {}
  expect:
    error:
      code: not_configured
      retryable: false
- name: consistency_scan_with_an_input_key_is_invalid
  tool: consistency-scan
  input:
    dry_run: true
  expect:
    error:
      code: invalid_input
- name: memory_refresh_prepare_without_a_store_root_is_not_configured
  tool: memory-refresh-prepare
  input: {}
  expect:
    error:
      code: not_configured
      retryable: false
- name: memory_refresh_prepare_with_an_input_key_is_invalid
  tool: memory-refresh-prepare
  input:
    dry_run: true
  expect:
    error:
      code: invalid_input
- name: memory_refresh_apply_without_a_store_root_is_not_configured
  tool: memory-refresh-apply
  input:
    basis:
      latest: null
      file: null
      cursor: null
      now: []
    cursor_to: null
    session_ids: []
    backlog: 0
    passed_stems: []
    answer:
      profile: ""
      milestones: []
  expect:
    error:
      code: not_configured
      retryable: false
- name: memory_refresh_apply_with_an_input_key_is_invalid
  tool: memory-refresh-apply
  input:
    dry_run: true
  expect:
    error:
      code: invalid_input
