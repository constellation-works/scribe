# scribe's Orbit plugin (docs/design/scribe/2_design.md §1). The backend is
# the installed `scribe` binary, run as `scribe plugin call`; this tree holds
# no code of its own. No tool is advertised to agents: the three routine
# tools are `mutating`, not agent-callable and `mcp_scope: none`, the three
# routines ship `enabled: false`, and tests/conformance.rs (run by
# `cargo test`) keeps it that way.
schemaVersion: 2
kind: Plugin
metadata:
  name: scribe
  version: 0.3.0
  description: >-
    The routine jobs that keep the user's scribe store current: session
    passes, the consistency scan and the memory refresh.
  homepage: https://github.com/constellation-works/scribe
spec:
  requires:
    orbit: ">=0.40.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]
    # `scribe` is installed with `make install`; `claude` runs the models.
    programs: [scribe, claude]

  backend:
    type: exec
    command: bin/scribe-plugin
    # The cap. session-pass starts no session after 50 s, and one session is
    # at most two 121 s asks; memory-refresh is one 120 s call;
    # consistency-scan calls no model.
    timeout_ms: 300000
    sandbox: default

  permissions:
    fs:
      # The store, which the routine tools write; and
      # Claude Code's transcripts, which session-pass reads.
      read: ["{{config.root}}", "{{config.transcripts}}", "{{config.codex_home}}"]
      write: ["{{config.root}}", "{{plugin_state}}"]
    # The session and profile models, through the claude CLI.
    network: any
    # The model credential names config.toml lists by default (§8). A
    # `[redact] env` name in the store's config.toml must be added here
    # too: without a value in the routine's environment, the mutating
    # routine tools refuse (redact_env_unset) rather than write unmasked.
    env_pass: [CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY, OPENAI_API_KEY]

  config:
    schema: schemas/config.json
    defaults:
      # Must be set to the absolute store path; every call answers
      # `not_configured` until it is. The default `/var/tmp` means unset, and
      # scribe never opens a store there: a write grant must name a
      # directory that exists, outside the install tree (Orbit resolves an
      # empty or relative path against it), so the default can be neither
      # empty nor made up (4_decisions.md).
      group_summary_crew: haiku
      profile_refresh_crew: haiku
      root: /var/tmp
      # Claude Code's projects directory, an absolute path; session-pass
      # answers `not_configured` until it is set.
      transcripts: ""
      # Optional Codex provider state: active/archive rollouts and existing auth.
      codex_home: ""

  tools:
    - name: session-pass
      description: >-
        The scribe-session-pass routine's job: write the record of each
        session whose pass is due, at most five per call, as `scribe session
        pass --json` does. Needs [plugins.scribe] root and transcripts or codex_home.
      execution_kind: mutating
      agent_callable: false
      mcp_scope: none
      input_schema: { $ref: schemas/empty.input.json }
      output_schema: { $ref: schemas/routine.output.json }

    - name: consistency-scan
      description: >-
        The scribe-consistency routine's job: re-apply interrupted approvals,
        then open a proposal for each entry due for review and deactivate
        sessions past the age limit, as `scribe consistency scan --json` does,
        with no model call. Changes no entry otherwise; the user settles proposals with #scribe approve or
        #scribe reject. Needs [plugins.scribe] root.
      execution_kind: mutating
      agent_callable: false
      mcp_scope: none
      input_schema: { $ref: schemas/empty.input.json }
      output_schema: { $ref: schemas/routine.output.json }

    - name: memory-refresh-prepare
      description: >-
        Prepare bounded memory refresh inputs and optimistic basis for
        scribe_profile_refresh, replaying any open memory journal first.
        Returns nothing_new: true when there is nothing to refresh. Needs
        [plugins.scribe] root.
      execution_kind: mutating
      agent_callable: false
      mcp_scope: none
      input_schema: { $ref: schemas/empty.input.json }
      output_schema: { $ref: schemas/memory-refresh-prepare.output.json }

    - name: memory-refresh-apply
      description: >-
        Verify and commit a rebuilt memory profile and promoted milestones
        against the prepared optimistic basis. Returns status retry with a
        correction when allow_retry is true and profile or milestone checks
        refuse. Needs [plugins.scribe] root.
      execution_kind: mutating
      agent_callable: false
      mcp_scope: none
      input_schema: { $ref: schemas/memory-refresh-apply.input.json }
      output_schema: { $ref: schemas/memory-refresh-apply.output.json }

    - name: group-close-prepare
      description: Prepare bounded authorized group evidence for a summary.
      execution_kind: read_only
      agent_callable: false
      mcp_scope: none
      input_schema: { $ref: schemas/group-close-prepare.input.json }
      output_schema: { $ref: schemas/group-close-prepare.output.json }

    - name: group-close-apply
      description: Verify and commit a supplied group summary.
      execution_kind: mutating
      agent_callable: false
      mcp_scope: none
      input_schema: { $ref: schemas/group-close-apply.input.json }
      output_schema: { $ref: schemas/group-close-apply.output.json }

  definitions:
    jobs: [jobs/session_pass.yaml, jobs/consistency.yaml, jobs/memory_refresh.yaml, jobs/group_close.yaml]
    activities: [activities/group_summarize.yaml, activities/profile_refresh.yaml]
    routines: [routines/session_pass.yaml, routines/consistency.yaml, routines/memory_refresh.yaml]

  tests: [tests/conformance/*.yaml]
