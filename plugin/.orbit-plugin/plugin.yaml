# scribe's Orbit plugin (docs/design/scribe/2_design.md §1). The backend is
# the installed `scribe` binary, run as `scribe plugin call`; this tree holds
# no code of its own. `scribe.ask` is the one tool agents see: the two
# routine tools are `mutating`, not agent-callable and `mcp_scope: none`, and
# tests/conformance.rs (run by `cargo test`) keeps it that way.
schemaVersion: 2
kind: Plugin
metadata:
  name: scribe
  version: 0.1.0
  description: >-
    Daniel's explicitly recorded decisions and preferences and the records of
    the sessions he cataloged, answered with verbatim citations.
  homepage: https://github.com/constellation-works/scribe
spec:
  requires:
    orbit: ">=0.40.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]
    # `scribe` is installed with `make install`; `claude` answers questions.
    programs: [scribe, claude]

  backend:
    type: exec
    command: bin/scribe-plugin
    # ask: up to 30 s of Orbit task reads, then a 90 s model budget. The
    # routine tools are not wired yet; they answer at once.
    timeout_ms: 150000
    sandbox: default

  permissions:
    fs:
      # The store; `ask` only reads it.
      read: ["{{config.root}}"]
      write: ["{{plugin_state}}"]
    # The ask model, through the claude CLI.
    network: any
    # The model credential names config.toml lists by default (§8).
    env_pass: [CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY]
    # Read-only task evidence for ask.
    orbit_tools: [orbit.search, orbit.task.show]

  config:
    schema: schemas/config.json
    defaults:
      # Must be set to the absolute store path; a call answers
      # `not_configured` until it is.
      root: ""
      task_workspaces: []

  tools:
    - name: ask
      description: >-
        Answer a question about what Daniel decided, prefers or did, from his
        #scribe entries, the session records he turned on with /scribe on, and
        Orbit tasks. Every claim carries a quote checked verbatim against the
        record it cites; claims that fail are dropped and counted, two
        disagreeing records come back as a conflict with both cites, and
        nothing recorded is `no_record`. Lookups (the last session, a named
        session, open next steps, a tag's entries this week, a term Daniel
        defined, the last on-call session for a workspace) return the stored
        records verbatim with status `record`. Writes nothing.
      execution_kind: read_only
      mcp_scope: global
      input_schema: { $ref: schemas/ask.input.json }
      output_schema: { $ref: schemas/ask.output.json }

    - name: session-pass
      description: >-
        The scribe-session-pass routine's job: write the record of each
        session whose pass is due. Not wired to the plugin yet; run
        `scribe session pass`.
      execution_kind: mutating
      agent_callable: false
      mcp_scope: none
      input_schema: { $ref: schemas/empty.input.json }
      output_schema: { $ref: schemas/routine.output.json }

    - name: consistency-scan
      description: >-
        The scribe-consistency routine's job: propose superseding
        contradicting entries and reviewing stale ones. Not built yet.
      execution_kind: mutating
      agent_callable: false
      mcp_scope: none
      input_schema: { $ref: schemas/empty.input.json }
      output_schema: { $ref: schemas/routine.output.json }

  tests: [tests/conformance/*.yaml]
