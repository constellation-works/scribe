# Seeded disabled as `scribe-memory-refresh` (2_design.md §15.6). Every
# Sunday at 05:00 it runs the scribe-memory-refresh job, which calls
# scribe.memory-refresh: the profile rebuilt from the week's sessions, Pinned
# kept, and now items past their 14 days made milestones or history.
# Installing (enabling) it is the user's.
schemaVersion: 1
name: memory-refresh
description: Rebuild the scribe profile weekly and settle passed now items.
enabled: false
trigger:
  cron: "0 5 * * 0"
  missed_run: skip
target: job:scribe-memory-refresh
policy:
  timeout_minutes: 6
  overlap: forbid
