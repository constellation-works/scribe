# The scribe-consistency routine's job: one call to scribe.consistency-scan.
schemaVersion: 2
kind: Job
metadata:
  name: scribe-consistency
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  steps:
    - id: consistency-scan
      timeout_seconds: 300
      spec:
        type: deterministic
        action: plugin.tool_call
        config:
          tool: scribe.consistency-scan
          input: {}
