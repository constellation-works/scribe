schemaVersion: 2
kind: Job
metadata:
  name: scribe-session-catalog
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  # `session` and `author` are required; the job refuses without them.
  default_input:
    session: ""
    author: ""
    project: null
    provider: null
  steps:
    # The catalog switch, as `scribe session catalog` writes it; a switch
    # a failed or interrupted catalog left is resumed, not rewritten.
    - id: begin
      timeout_seconds: 60
      spec:
        type: deterministic
        action: plugin.tool_call
        config:
          tool: scribe.session-catalog-begin
      default_input:
        input:
          session: "{{ input.session }}"
          author: "{{ input.author }}"
          project: "{{ input.project }}"
          provider: "{{ input.provider }}"
    # Fan-in seeds an empty cursor and replaces it with the committed
    # continuation after each iteration. A fan-out step takes its timeout on
    # its worker.
    - id: seed_cursor
      fan_out:
        items: "[]"
        worker:
          id: unused_seed
          timeout_seconds: 60
          spec:
            type: deterministic
            action: plugin.tool_call
            config:
              tool: scribe.session-pass-prepare
      fan_in:
        join: { mode: all }
        collect: pass_cursor
    - id: windows
      loop:
        # One window per iteration and no deadline: a transcript longer
        # than this stays due, and the next run (or session pass) resumes it.
        max_iterations: 100
        break_when: "{{ steps.prepare.output.done }} == true"
        steps:
          - id: prepare
            timeout_seconds: 60
            spec:
              type: deterministic
              action: plugin.tool_call
              config:
                tool: scribe.session-pass-prepare
            default_input:
              input:
                sessions: "{{ steps.begin.output.sessions }}"
                resolve: false
                catalog: "{{ steps.begin.output.catalog }}"
                progress: "{{ steps.pass_cursor.output }}"
          # The skipped second worker gives the join a successful branch so
          # the fallback can record backoff and report the activity failure.
          - id: distill
            fan_out:
              items: "[true, false]"
              max_workers: 1
              worker:
                id: distill_window
                timeout_seconds: 300
                when: "{{ item }} == true && {{ steps.prepare.output.needs_model }} == true"
                target: activity:scribe_session_distill
                default_input:
                  request: "{{ steps.prepare.output.window_request }}"
                  crew: "{{ steps.prepare.output.session_distill_crew }}"
            fan_in:
              join: { mode: any }
              errors: distill_errors
          # Record the failure's code and backoff; apply then moves the run
          # on to the next session.
          - id: fail_distill
            when: "{{ steps.prepare.output.needs_model }} == true && {{ steps.distill.output }} == [null,null]"
            timeout_seconds: 60
            target: activity:scribe_session_pass_fail
            default_input:
              input:
                basis: "{{ steps.prepare.output.basis }}"
                errors: "{{ steps.distill_errors.output }}"
          - id: apply
            timeout_seconds: 60
            spec:
              type: deterministic
              action: plugin.tool_call
              config:
                tool: scribe.session-pass-apply
            default_input:
              input:
                basis: "{{ steps.prepare.output.basis }}"
                cursor: "{{ steps.prepare.output.cursor }}"
                answer: "{{ steps.distill.output }}"
          - id: compress
            fan_out:
              items: "[true, false]"
              max_workers: 1
              worker:
                id: compress_header
                timeout_seconds: 300
                when: "{{ item }} == true && {{ steps.apply.output.status }} == retry_header"
                target: activity:scribe_session_header_compress
                default_input:
                  request: "{{ steps.apply.output.header_request }}"
                  crew: "{{ steps.prepare.output.session_header_crew }}"
            fan_in:
              join: { mode: any }
              errors: compress_errors
          - id: distill_retry
            fan_out:
              items: "[true, false]"
              max_workers: 1
              worker:
                id: distill_corrected_window
                timeout_seconds: 300
                when: "{{ item }} == true && {{ steps.apply.output.status }} == retry_window"
                target: activity:scribe_session_distill
                default_input:
                  request: "{{ steps.apply.output.window_request }}"
                  crew: "{{ steps.prepare.output.session_distill_crew }}"
            fan_in:
              join: { mode: any }
              errors: distill_retry_errors
          - id: fail_compress
            when: "{{ steps.apply.output.status }} == retry_header && {{ steps.compress.output }} == [null,null]"
            timeout_seconds: 60
            target: activity:scribe_session_pass_fail
            default_input:
              input:
                basis: "{{ steps.prepare.output.basis }}"
                errors: "{{ steps.compress_errors.output }}"
          - id: fail_retry
            when: "{{ steps.apply.output.status }} == retry_window && {{ steps.distill_retry.output }} == [null,null]"
            timeout_seconds: 60
            target: activity:scribe_session_pass_fail
            default_input:
              input:
                basis: "{{ steps.prepare.output.basis }}"
                errors: "{{ steps.distill_retry_errors.output }}"
          - id: carry
            fan_out:
              items: "[true]"
              worker:
                id: apply_retry
                timeout_seconds: 60
                spec:
                  type: deterministic
                  action: plugin.tool_call
                  config:
                    tool: scribe.session-pass-apply
                default_input:
                  input:
                    basis: "{{ steps.prepare.output.basis }}"
                    cursor: "{{ steps.apply.output.cursor }}"
                    answer: "{{ steps.distill.output }}"
                    retry_answer: "{{ steps.distill_retry.output }}"
                    header: "{{ steps.compress.output }}"
                    correction: "{{ steps.apply.output.correction }}"
                    repair: true
                    previous_status: "{{ steps.apply.output.status }}"
            fan_in:
              join: { mode: all }
              collect: pass_cursor
