# Seeded disabled. The job distills and commits one window at a time.
schemaVersion: 1
name: session-pass
description: Write the record of each scribe session whose pass is due.
enabled: false
trigger:
  cron: "*/5 * * * *"
  missed_run: skip
target: job:scribe-session-pass
policy:
  timeout_minutes: 6
  overlap: forbid
